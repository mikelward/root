name: ci

# The real test gate this repository's ruleset can require (TODO.md "Run the
# suite in CI"): the two suites AGENTS.md already calls mandatory before a
# commit — `make test` (`cargo test --release`) for the primary Rust build,
# and `make -C legacy test` for the C fallback under legacy/, which is
# security-relevant on its own (the setuid binary this repo ships when no
# Rust toolchain is available). Both ran only on a developer's machine until
# now. `lanes` is the one check the ruleset should require — see
# .github/lanes.conf and mikelward/lanes for the docs/code classification
# that lets a housekeeping-only diff skip both suites without weakening the
# gate.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the lane on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  # mikelward/rust-update's weekly batch opens its PR under a GitHub App
  # identity (a real collaborator), so on: pull_request already starts this
  # workflow normally; the dispatch below is rust-update.yml's own
  # belt-and-suspenders fallback, and every call names the PR it reports for.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number this run reports for.
        required: true
        type: string

# Read-only: this workflow builds and tests, it never writes to the
# repository.
permissions:
  contents: read
  # The docs lane's classify and lanes steps read the PR's files and commits
  # through the workflow token; read-only, and still nothing here can write.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the heavy jobs may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes to main are always
  # classified as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  # The primary, supported implementation.
  test:
    name: make test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull_request run's default ref is already the right merge
          # commit; only a dispatched run needs steering — its default ref
          # is whatever branch the dispatch targeted, not the PR named by
          # inputs.pr, so this job would otherwise test the wrong commit
          # while classify/lanes (which read the PR via the API, not the
          # checkout) correctly reported on the named PR.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.sha }}
      - run: make test

  # The setuid fallback for machines without a Rust toolchain. Untested
  # changes here are a security change (AGENTS.md), so this suite is not
  # optional just because the Rust build is primary.
  legacy-test:
    name: make -C legacy test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Same reasoning as the test job above.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.sha }}
      - run: make -C legacy test

  # FreeBSD and macOS are platforms SPEC.md supports but no runner here is, so
  # this checks them by cross-compiling on Ubuntu, the way mikelward/mesh does,
  # rather than paying for a macOS image. It catches code that doesn't build or
  # link there (macOS needs its own group calls in src/user.rs), but it never
  # runs a test on either platform.
  cross:
    name: cross-check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Same reasoning as the test job above.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.sha }}

      - name: Install FreeBSD and macOS targets
        run: rustup target add x86_64-unknown-freebsd aarch64-apple-darwin

      # `cargo check` stops short of linking, so FreeBSD needs no cross linker
      # or sysroot.
      - name: Check FreeBSD
        run: cargo check --all-targets --target x86_64-unknown-freebsd

      # Zig ships the macOS libc headers and link stubs, so both builds can be
      # compiled and linked for macOS here, test binaries included (built, not
      # run): that goes past `cargo check` to code generation and to symbol
      # resolution against libSystem. cargo-zigbuild drives Zig as the linker
      # and supplies the libiconv the Rust standard library links on Apple,
      # which would otherwise need Apple's SDK.
      #
      # Zig comes from PyPI's `ziglang` package rather than setup-zig, whose
      # random community mirror once took over five minutes to serve it. With
      # the venv first on PATH, cargo-zigbuild finds that Zig through
      # `python3 -m ziglang`. Both are pinned, so a Zig release with new
      # warnings cannot turn the -Werror C build red with no change here.
      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.16.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      # Apple Silicon only: the macOS code keys on the vendor, not the
      # architecture, so x86_64 would add no coverage.
      - name: Build for macOS
        run: cargo zigbuild --all-targets --target aarch64-apple-darwin

      - name: Build the C fallback for macOS
        run: make -C legacy CC="python3 -m ziglang cc -target aarch64-macos" root loggingtest.o pathtest.o argstest.o

  # The one check the ruleset should require. Always runs, always reports —
  # green only when the heavy jobs succeeded, or when they were skipped and
  # the skip is INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test, legacy-test, cross]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded before
          # the heavy jobs ran; a pull_request run takes the same commit from
          # its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
            legacy-test=${{ needs.legacy-test.result }}
            cross=${{ needs.cross.result }}
