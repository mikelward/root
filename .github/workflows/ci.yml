name: CI

# The real test gate this repository's ruleset can require (TODO.md "Run the
# suite in CI"): the two suites AGENTS.md already calls mandatory before a
# commit — `make test` (`cargo test --release`) for the primary Rust build,
# and `make -C legacy test` for the C fallback under legacy/, which is
# security-relevant on its own (the setuid binary this repo ships when no
# Rust toolchain is available). Both ran only on a developer's machine until
# now. `lanes` is the one check the ruleset should require — see
# .github/lanes.conf and mikelward/lanes for the docs/code classification
# that lets a housekeeping-only diff skip both suites without weakening the
# gate.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the lane on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  # mikelward/rust-update's weekly batch opens its PR under a GitHub App
  # identity (a real collaborator), so on: pull_request already starts this
  # workflow normally; the dispatch below is rust-update.yml's own
  # belt-and-suspenders fallback, and every call names the PR it reports for.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number this run reports for.
        required: true
        type: string

# Read-only: this workflow builds and tests, it never writes to the
# repository.
permissions:
  contents: read
  # The docs lane's classify and lanes steps read the PR's files and commits
  # through the workflow token; read-only, and still nothing here can write.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the heavy jobs may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes to main are always
  # classified as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  # The primary, supported implementation.
  test:
    name: make test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make test

  # The setuid fallback for machines without a Rust toolchain. Untested
  # changes here are a security change (AGENTS.md), so this suite is not
  # optional just because the Rust build is primary.
  legacy-test:
    name: make -C legacy test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make -C legacy test

  # The one check the ruleset should require. Always runs, always reports —
  # green only when the heavy jobs succeeded, or when they were skipped and
  # the skip is INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test, legacy-test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded before
          # the heavy jobs ran; a pull_request run takes the same commit from
          # its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
            legacy-test=${{ needs.legacy-test.result }}
