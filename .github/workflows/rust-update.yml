name: Rust dependency update

# Weekly Cargo.lock batch, as mikelward/rust-update's reusable workflow —
# see https://github.com/mikelward/rust-update for what it does and its
# trust model. This file just supplies the schedule and the permissions the
# reusable workflow's jobs downscope from; the update and publish logic all
# lives there.
on:
  schedule:
    - cron: '11 6 * * 6'   # Saturdays, off the congested top of the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-update
  cancel-in-progress: false

jobs:
  update:
    uses: mikelward/rust-update/.github/workflows/rust-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    secrets:
      # See docs/GITHUB_APP.md in mikelward/rust-update: opens the PR as a
      # real collaborator, so ci.yml's `gate` starts on it normally — no
      # first-time-contributor approval to click through.
      app-id: ${{ secrets.RUST_UPDATE_APP_ID }}
      app-private-key: ${{ secrets.RUST_UPDATE_APP_PRIVATE_KEY }}
    with:
      # Matches the Makefile's own `make test` invocation (`cargo test
      # --release`), plus `--locked` so a check cannot quietly re-resolve
      # what the engine settled. A Cargo.lock-only diff never touches
      # legacy/ (a separate, untracked-by-Cargo C codebase), so `make -C
      # legacy test` has nothing to re-verify here — ci.yml still runs it
      # on every PR regardless, via the dispatch below.
      checks: |
        cargo test --release --locked
      # Belt-and-suspenders fallback: covers a rerun that adopts a PR from
      # before the App secrets above existed, and the (unexpected) case of
      # the App token being unset. Names ci.yml's real gate (make test,
      # make -C legacy test) explicitly so it can be dispatched.
      ci-workflow: ci.yml
