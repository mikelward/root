# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives — prose cannot change a build, and neither `cargo test`
# nor `make -C legacy test` reads any of this repo's markdown — while
# everything else is code, including .gitignore (ignore rules can hide files
# from CI's own staging steps).
docs **/*.md

# The subject prefixes a commit on this lane must carry, so nothing here can
# ever read like a bare behavior-change subject. Only the two housekeeping
# prefixes a markdown-only diff can actually earn: docs: and a todo:-only
# TODO.md edit.
prefixes docs todo

# ci.yml's workflow_dispatch exists for mikelward/rust-update's
# belt-and-suspenders fallback dispatch (see rust-update.yml) and for manual
# `gh workflow run`, and both always name the pull request they report for —
# so a PR-less dispatch is never legitimate, on any ref.
dispatch-without-pr refuse
